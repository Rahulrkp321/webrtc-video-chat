<!DOCTYPE html>
<!--
============================================
WebRTC Video-Chat - Register Page
============================================
User registration form with validation.

WHAT THIS PAGE DOES:
1. Shows registration form
2. Validates all inputs
3. Calls register API
4. Stores token on success
5. Redirects to dashboard
============================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account for WebRTC Video-Chat">
    
    <title>Register - WebRTC Video-Chat</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Main Content -->
    <div class="center-page">
        <div class="auth-card card">
            <div class="card-body">
                <!-- Logo -->
                <div class="auth-logo">
                    <div class="icon">🎥</div>
                    <h1 class="text-gradient">Create Account</h1>
                    <p>Join WebRTC Video-Chat today</p>
                </div>
                
                <!-- Alert for errors -->
                <div id="register-alert" class="alert alert-error hidden">
                    <span id="register-alert-message"></span>
                </div>
                
                <!-- Register Form -->
                <form id="register-form" novalidate>
                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-icon">👤</span>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-input" 
                                placeholder="Choose a username"
                                autocomplete="username"
                                required
                            >
                        </div>
                        <div id="username-error" class="form-error"></div>
                    </div>
                    
                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-icon">📧</span>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <div id="email-error" class="form-error"></div>
                    </div>
                    
                    <!-- Display Name Field -->
                    <div class="form-group">
                        <label for="display_name" class="form-label">Display Name <span class="text-muted">(optional)</span></label>
                        <div class="input-group">
                            <span class="input-icon">✨</span>
                            <input 
                                type="text" 
                                id="display_name" 
                                name="display_name" 
                                class="form-input" 
                                placeholder="How should we call you?"
                                autocomplete="name"
                            >
                        </div>
                        <div id="display_name-error" class="form-error"></div>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Create a password (min 6 characters)"
                                autocomplete="new-password"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                👁️
                            </button>
                        </div>
                        <div id="password-error" class="form-error"></div>
                    </div>
                    
                    <!-- Confirm Password Field -->
                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="confirm_password" 
                                name="confirm_password" 
                                class="form-input" 
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')">
                                👁️
                            </button>
                        </div>
                        <div id="confirm_password-error" class="form-error"></div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" id="register-btn" class="btn btn-primary btn-block btn-lg">
                        Create Account
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="divider">or</div>
                
                <!-- Login Link -->
                <p class="text-center text-muted">
                    Already have an account? 
                    <a href="/login">Sign in</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="/static/js/auth.js"></script>
    <script>
        /**
         * Register Page JavaScript
         * Handles form submission and validation.
         */
        
        // Check if already logged in
        Auth.redirectIfLoggedIn();
        
        // Get form elements
        const registerForm = document.getElementById('register-form');
        const registerBtn = document.getElementById('register-btn');
        const alertBox = document.getElementById('register-alert');
        const alertMessage = document.getElementById('register-alert-message');
        
        /**
         * Toggle password visibility.
         */
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
        
        /**
         * Show error alert.
         */
        function showAlert(message) {
            alertMessage.textContent = message;
            alertBox.classList.remove('hidden');
        }
        
        /**
         * Hide error alert.
         */
        function hideAlert() {
            alertBox.classList.add('hidden');
        }
        
        /**
         * Validate form inputs.
         */
        function validateForm() {
            let isValid = true;
            Auth.clearAllErrors(registerForm);
            hideAlert();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            // Validate username
            if (!username) {
                Auth.showFieldError('username', 'Username is required');
                isValid = false;
            } else if (!Auth.isValidUsername(username)) {
                Auth.showFieldError('username', 'Username must be 3-50 characters (letters, numbers, underscore only)');
                isValid = false;
            }
            
            // Validate email
            if (!email) {
                Auth.showFieldError('email', 'Email is required');
                isValid = false;
            } else if (!Auth.isValidEmail(email)) {
                Auth.showFieldError('email', 'Please enter a valid email address');
                isValid = false;
            }
            
            // Validate password
            if (!password) {
                Auth.showFieldError('password', 'Password is required');
                isValid = false;
            } else if (!Auth.isValidPassword(password)) {
                Auth.showFieldError('password', 'Password must be at least 6 characters');
                isValid = false;
            }
            
            // Validate confirm password
            if (!confirmPassword) {
                Auth.showFieldError('confirm_password', 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                Auth.showFieldError('confirm_password', 'Passwords do not match');
                isValid = false;
            }
            
            return isValid;
        }
        
        /**
         * Handle form submission.
         */
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate
            if (!validateForm()) {
                return;
            }
            
            // Get values
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const displayName = document.getElementById('display_name').value.trim();
            const password = document.getElementById('password').value;
            
            // Show loading
            Auth.setButtonLoading(registerBtn, true);
            hideAlert();
            
            try {
                // Call register API
                const response = await Auth.register(username, email, password, displayName);
                
                if (response.success) {
                    // Show success message
                    Auth.showToast('Account created! Redirecting...', 'success');
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    // Show error
                    showAlert(response.message || 'Registration failed. Please try again.');
                    Auth.setButtonLoading(registerBtn, false);
                }
            } catch (error) {
                console.error('Register error:', error);
                showAlert('An error occurred. Please try again.');
                Auth.setButtonLoading(registerBtn, false);
            }
        });
        
        // Clear errors on input
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', () => {
                Auth.clearFieldError(input.id);
                hideAlert();
            });
        });
    </script>
</body>
</html>
