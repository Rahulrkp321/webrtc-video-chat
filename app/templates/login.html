<!DOCTYPE html>
<!--
============================================
WebRTC Video-Chat - Login Page
============================================
User login form with email/username and password.

WHAT THIS PAGE DOES:
1. Shows login form
2. Validates input
3. Calls login API
4. Stores token on success
5. Redirects to dashboard
============================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to WebRTC Video-Chat">
    
    <title>Login - WebRTC Video-Chat</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Main Content -->
    <div class="center-page">
        <div class="auth-card card">
            <div class="card-body">
                <!-- Logo -->
                <div class="auth-logo">
                    <div class="icon">🎥</div>
                    <h1 class="text-gradient">Welcome Back</h1>
                    <p>Sign in to continue to WebRTC Video-Chat</p>
                </div>
                
                <!-- Alert for errors -->
                <div id="login-alert" class="alert alert-error hidden">
                    <span id="login-alert-message"></span>
                </div>
                
                <!-- Login Form -->
                <form id="login-form" novalidate>
                    <!-- Email/Username Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email or Username</label>
                        <div class="input-group">
                            <span class="input-icon">📧</span>
                            <input 
                                type="text" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                placeholder="Enter your email or username"
                                autocomplete="username"
                                required
                            >
                        </div>
                        <div id="email-error" class="form-error"></div>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                👁️
                            </button>
                        </div>
                        <div id="password-error" class="form-error"></div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg">
                        Sign In
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="divider">or</div>
                
                <!-- Register Link -->
                <p class="text-center text-muted">
                    Don't have an account? 
                    <a href="/register">Create one</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="/static/js/auth.js"></script>
    <script>
        /**
         * Login Page JavaScript
         * Handles form submission and validation.
         */
        
        // Check if already logged in
        Auth.redirectIfLoggedIn();
        
        // Get form elements
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const alertBox = document.getElementById('login-alert');
        const alertMessage = document.getElementById('login-alert-message');
        
        /**
         * Toggle password visibility.
         */
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
        
        /**
         * Show error alert.
         */
        function showAlert(message) {
            alertMessage.textContent = message;
            alertBox.classList.remove('hidden');
        }
        
        /**
         * Hide error alert.
         */
        function hideAlert() {
            alertBox.classList.add('hidden');
        }
        
        /**
         * Validate form inputs.
         */
        function validateForm() {
            let isValid = true;
            Auth.clearAllErrors(loginForm);
            hideAlert();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Validate email/username
            if (!email) {
                Auth.showFieldError('email', 'Email or username is required');
                isValid = false;
            }
            
            // Validate password
            if (!password) {
                Auth.showFieldError('password', 'Password is required');
                isValid = false;
            }
            
            return isValid;
        }
        
        /**
         * Handle form submission.
         */
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate
            if (!validateForm()) {
                return;
            }
            
            // Get values
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Show loading
            Auth.setButtonLoading(loginBtn, true);
            hideAlert();
            
            try {
                // Call login API
                const response = await Auth.login(email, password);
                
                if (response.success) {
                    // Show success message
                    Auth.showToast('Login successful! Redirecting...', 'success');
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = Auth.getRedirectUrl();
                    }, 1000);
                } else {
                    // Show error
                    showAlert(response.message || 'Login failed. Please try again.');
                    Auth.setButtonLoading(loginBtn, false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred. Please try again.');
                Auth.setButtonLoading(loginBtn, false);
            }
        });
        
        // Clear errors on input
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', () => {
                Auth.clearFieldError(input.id);
                hideAlert();
            });
        });
    </script>
</body>
</html>
